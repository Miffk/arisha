<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ариша, я тебя люблю</title>
<meta name="description" content="Для самой любимой ❤">
<meta property="og:title" content="Ариша, я тебя люблю ❤">
<meta property="og:description" content="Открой — это для тебя">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #12001f;
    --bg-2: #3a0a3d;
    --bg-3: #7a1748;
    --rose: #ff7aa8;
    --rose-soft: #ffd1e1;
    --gold: #ffe2b8;
    --text: #fff5f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    overflow: hidden;
    color: var(--text);
    background: radial-gradient(120% 90% at 50% 110%, var(--bg-3) 0%, var(--bg-2) 40%, var(--bg-1) 80%) fixed;
    background-color: var(--bg-1);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sky { z-index: 0; }
  #fx { z-index: 2; pointer-events: none; }

  .aurora {
    position: fixed; inset: -20%;
    z-index: 1; pointer-events: none;
    background:
      radial-gradient(40% 30% at 30% 40%, rgba(255,122,168,.22), transparent 70%),
      radial-gradient(35% 28% at 70% 60%, rgba(186,104,255,.18), transparent 70%),
      radial-gradient(30% 25% at 50% 30%, rgba(255,214,170,.12), transparent 70%);
    filter: blur(30px);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(-3%, -2%) rotate(0deg) scale(1); }
    100% { transform: translate(3%, 2%) rotate(8deg) scale(1.08); }
  }

  main {
    position: relative; z-index: 3;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px 16px;
    pointer-events: none;
  }

  .heart {
    width: clamp(90px, 22vw, 150px);
    aspect-ratio: 1;
    margin-bottom: clamp(12px, 3vh, 28px);
    filter: drop-shadow(0 0 22px rgba(255,90,140,.75)) drop-shadow(0 0 60px rgba(255,90,140,.45));
    opacity: 0;
    animation: appear 1.4s .2s cubic-bezier(.2,.8,.2,1) forwards, beat 1.3s 1.8s ease-in-out infinite;
  }
  @keyframes appear { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.14); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  h1 {
    font-family: "Marck Script", cursive;
    font-weight: 400;
    line-height: 1.1;
    font-size: clamp(54px, 13vw, 150px);
    letter-spacing: .01em;
  }
  h1 .line { display: block; white-space: nowrap; }
  h1 .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(.4em) scale(.9);
    filter: blur(10px);
    background: linear-gradient(100deg, #fff 0%, var(--rose-soft) 30%, var(--gold) 50%, var(--rose-soft) 70%, #fff 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255,140,180,.35);
    animation:
      letter 1s cubic-bezier(.2,.8,.2,1) forwards,
      shimmer 6s linear infinite;
  }
  h1 .sp { display: inline-block; width: .28em; }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shimmer { from { background-position: 0% 0; } to { background-position: 300% 0; } }

  .sub {
    margin-top: clamp(16px, 4vh, 36px);
    font-style: italic;
    font-size: clamp(18px, 3.6vw, 28px);
    color: var(--rose-soft);
    opacity: 0;
    letter-spacing: .04em;
    min-height: 1.5em;
    transition: opacity 1.2s ease;
  }
  .sub.show { opacity: .9; }

  .hint {
    position: fixed; z-index: 3;
    left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 15px; letter-spacing: .2em; text-transform: lowercase;
    color: rgba(255,220,232,.55);
    opacity: 0;
    animation: fadeIn 2s 5.5s forwards, breathe 3s 7.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .8; } }

  .counter {
    position: fixed; z-index: 3; top: max(16px, env(safe-area-inset-top)); right: 16px;
    font-size: 15px; color: rgba(255,220,232,.6);
    opacity: 0; transition: opacity .6s;
    pointer-events: none;
  }
  .counter.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .aurora, .heart { animation: appear .01s forwards; }
    h1 .ch { animation: letter .01s forwards; }
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="aurora"></div>
  <canvas id="fx"></canvas>

  <main>
    <svg class="heart" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb3cc"/>
          <stop offset=".45" stop-color="#ff4f8b"/>
          <stop offset="1" stop-color="#c2185b"/>
        </linearGradient>
        <radialGradient id="hl" cx=".32" cy=".3" r=".35">
          <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="url(#hg)"/>
      <path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="url(#hl)"/>
    </svg>

    <h1 id="title" aria-label="Ариша, я тебя люблю"></h1>
    <p class="sub" id="sub"></p>
  </main>

  <div class="counter" id="counter"></div>
  <div class="hint">коснись экрана ♡</div>

<script>
(() => {
  /* ---------- Заголовок по буквам ---------- */
  const lines = ["Ариша,", "я тебя люблю"];
  const title = document.getElementById("title");
  let delay = 0.9;
  lines.forEach(text => {
    const line = document.createElement("span");
    line.className = "line";
    line.setAttribute("aria-hidden", "true");
    for (const c of text) {
      if (c === " ") {
        const sp = document.createElement("span"); sp.className = "sp"; line.appendChild(sp);
        delay += 0.08; continue;
      }
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      s.style.animationDelay = `${delay}s, ${delay}s`;
      line.appendChild(s);
      delay += 0.11;
    }
    delay += 0.35;
    title.appendChild(line);
  });

  /* ---------- Сменяющиеся подписи ---------- */
  const phrases = [
    "ты — самое прекрасное, что со мной случилось",
    "с тобой каждый день — праздник",
    "ты моё солнышко и мой дом",
    "спасибо, что ты есть",
    "люблю тебя больше всех на свете",
    "ты делаешь мою жизнь счастливой",
    "навсегда вместе ♡"
  ];
  const sub = document.getElementById("sub");
  let pi = 0;
  function nextPhrase() {
    sub.classList.remove("show");
    setTimeout(() => {
      sub.textContent = phrases[pi % phrases.length];
      pi++;
      sub.classList.add("show");
    }, 900);
  }
  setTimeout(() => { nextPhrase(); setInterval(nextPhrase, 5200); }, (delay + 0.4) * 1000);

  /* ---------- Звёздное небо ---------- */
  const sky = document.getElementById("sky");
  const sctx = sky.getContext("2d");
  const fx = document.getElementById("fx");
  const ctx = fx.getContext("2d");
  let W, H, DPR, stars = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [sky, fx]) {
      c.width = W * DPR; c.height = H * DPR;
    }
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(W * H / 3500);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 0.02 + 0.005
    }));
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- Сердечки ---------- */
  function heartPath(c, x, y, size) {
    const s = size / 2;
    c.beginPath();
    c.moveTo(x, y + s * 0.7);
    c.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.45);
    c.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.2, y - s * 0.1, x, y + s * 0.7);
    c.closePath();
  }

  const palette = ["#ff4f8b", "#ff7aa8", "#ffb3cc", "#ff9a8b", "#e2558f", "#ffd1e1", "#c86bff"];
  const floaters = [];
  const bursts = [];
  const shooting = [];

  function spawnFloater(initial) {
    const size = Math.random() * 16 + 8;
    floaters.push({
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + 30,
      size,
      vy: -(Math.random() * 0.45 + 0.25) * (size / 14),
      sway: Math.random() * 1.5 + 0.5,
      phase: Math.random() * Math.PI * 2,
      rot: (Math.random() - 0.5) * 0.5,
      alpha: Math.random() * 0.35 + 0.25,
      color: palette[(Math.random() * palette.length) | 0]
    });
  }
  const floaterCount = () => Math.round(Math.min(45, W / 28));
  for (let i = 0; i < floaterCount(); i++) spawnFloater(true);

  function burst(x, y, n = 26) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 6 + 2;
      bursts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 2,
        size: Math.random() * 14 + 6,
        life: 1,
        decay: Math.random() * 0.012 + 0.01,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2,
        color: palette[(Math.random() * palette.length) | 0]
      });
    }
  }

  /* ---------- Клики / тапы ---------- */
  const counter = document.getElementById("counter");
  let taps = 0;
  const tapWords = ["люблю", "очень люблю", "безумно люблю", "бесконечно люблю"];
  addEventListener("pointerdown", e => {
    burst(e.clientX, e.clientY);
    taps++;
    counter.textContent = `${tapWords[Math.min(tapWords.length - 1, Math.floor(taps / 10))]} × ${taps}`;
    counter.classList.add("show");
  });

  // Небольшой салют из сердечек после появления текста
  setTimeout(() => burst(W / 2, H / 2, 60), (delay + 0.2) * 1000);

  /* ---------- Анимация ---------- */
  let t = 0;
  function frame() {
    t++;
    // небо
    sctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = 0.35 + Math.sin(t * s.s + s.p) * 0.35 + 0.3;
      sctx.globalAlpha = Math.max(0, Math.min(1, a));
      sctx.fillStyle = "#fff";
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
    }
    // падающие звёзды
    if (Math.random() < 0.004) {
      shooting.push({ x: Math.random() * W * 0.8, y: Math.random() * H * 0.4, vx: 7 + Math.random() * 4, vy: 3 + Math.random() * 2, life: 1 });
    }
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.018;
      const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
      g.addColorStop(0, `rgba(255,240,245,${s.life})`);
      g.addColorStop(1, "rgba(255,240,245,0)");
      sctx.globalAlpha = 1;
      sctx.strokeStyle = g; sctx.lineWidth = 1.6;
      sctx.beginPath(); sctx.moveTo(s.x, s.y); sctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); sctx.stroke();
      if (s.life <= 0) shooting.splice(i, 1);
    }
    sctx.globalAlpha = 1;

    // сердечки
    ctx.clearRect(0, 0, W, H);
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y += f.vy;
      const x = f.x + Math.sin(t * 0.01 * f.sway + f.phase) * 18;
      ctx.save();
      ctx.translate(x, f.y);
      ctx.rotate(f.rot + Math.sin(t * 0.008 + f.phase) * 0.15);
      ctx.globalAlpha = f.alpha;
      ctx.shadowColor = f.color; ctx.shadowBlur = 12;
      ctx.fillStyle = f.color;
      heartPath(ctx, 0, 0, f.size);
      ctx.fill();
      ctx.restore();
      if (f.y < -40) floaters.splice(i, 1);
    }
    while (floaters.length < floaterCount()) spawnFloater(false);

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy;
      b.vx *= 0.97; b.vy = b.vy * 0.97 + 0.08;
      b.rot += b.vr;
      b.life -= b.decay;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.globalAlpha = Math.max(0, b.life);
      ctx.shadowColor = b.color; ctx.shadowBlur = 16;
      ctx.fillStyle = b.color;
      heartPath(ctx, 0, 0, b.size * (0.6 + b.life * 0.4));
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
