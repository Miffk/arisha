<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ариша, я тебя люблю</title>
<meta name="description" content="Для самой любимой 💚">
<meta name="theme-color" content="#001a12">
<meta property="og:title" content="Ариша, я тебя люблю 💚">
<meta property="og:description" content="Открой — это для тебя">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #00140e;
    --bg-2: #04372a;
    --bg-3: #0c6a4a;
    --mint: #7af0b5;
    --mint-soft: #c9f7dd;
    --gold: #f3e3a6;
    --text: #f2fff7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    overflow: hidden;
    color: var(--text);
    background: radial-gradient(120% 90% at 50% 110%, var(--bg-3) 0%, var(--bg-2) 40%, var(--bg-1) 80%) fixed;
    background-color: var(--bg-1);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sky { z-index: 0; }
  #fx { z-index: 2; pointer-events: none; }

  /* Северное сияние */
  .aurora {
    position: fixed; inset: -20%;
    z-index: 1; pointer-events: none;
    background:
      radial-gradient(45% 22% at 30% 30%, rgba(60,230,150,.26), transparent 70%),
      radial-gradient(40% 20% at 70% 45%, rgba(40,200,190,.18), transparent 70%),
      radial-gradient(30% 25% at 50% 70%, rgba(243,227,166,.10), transparent 70%);
    filter: blur(30px);
    animation: drift 16s ease-in-out infinite alternate;
  }
  .aurora.two {
    background:
      radial-gradient(35% 14% at 60% 25%, rgba(120,255,180,.18), transparent 70%),
      radial-gradient(30% 16% at 25% 60%, rgba(30,170,120,.20), transparent 70%);
    animation: drift2 22s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(-4%, -2%) rotate(-4deg) scale(1); }
    100% { transform: translate(4%, 3%) rotate(6deg) scale(1.1); }
  }
  @keyframes drift2 {
    0%   { transform: translate(5%, 2%) rotate(5deg) scale(1.05); opacity: .6; }
    100% { transform: translate(-5%, -3%) rotate(-6deg) scale(.95); opacity: 1; }
  }

  main {
    position: relative; z-index: 3;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px 16px;
    pointer-events: none;
  }

  .heart {
    width: clamp(90px, 22vw, 150px);
    aspect-ratio: 1;
    margin-bottom: clamp(12px, 3vh, 28px);
    filter: drop-shadow(0 0 22px rgba(60,230,150,.7)) drop-shadow(0 0 60px rgba(60,230,150,.4));
    opacity: 0;
    animation: appear 1.4s .2s cubic-bezier(.2,.8,.2,1) forwards, beat 1.3s 1.8s ease-in-out infinite;
  }
  @keyframes appear { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.14); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  h1 {
    font-family: "Marck Script", cursive;
    font-weight: 400;
    line-height: 1.1;
    font-size: clamp(56px, 14vw, 150px);
    letter-spacing: .01em;
  }
  h1 .line { display: block; white-space: nowrap; }
  h1 .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(.4em) scale(.9);
    filter: blur(10px);
    background: linear-gradient(100deg, #fff 0%, var(--mint-soft) 30%, var(--gold) 50%, var(--mint-soft) 70%, #fff 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(90,240,170,.35);
    animation:
      letter 1s cubic-bezier(.2,.8,.2,1) forwards,
      shimmer 6s linear infinite;
  }
  h1 .sp { display: inline-block; width: .28em; }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shimmer { from { background-position: 0% 0; } to { background-position: 300% 0; } }

  .sub {
    margin-top: clamp(16px, 4vh, 36px);
    font-style: italic;
    font-size: clamp(18px, 3.6vw, 28px);
    color: var(--mint-soft);
    opacity: 0;
    letter-spacing: .04em;
    min-height: 1.5em;
    transition: opacity 1.2s ease;
  }
  .sub.show { opacity: .9; }

  .hint {
    position: fixed; z-index: 3;
    left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 15px; letter-spacing: .2em; text-transform: lowercase;
    color: rgba(200,247,221,.6);
    opacity: 0;
    animation: fadeIn 2s 5.5s forwards, breathe 3s 7.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .85; } }

  .counter {
    position: fixed; z-index: 3; top: max(16px, env(safe-area-inset-top)); right: 16px;
    font-size: 15px; color: rgba(200,247,221,.65);
    opacity: 0; transition: opacity .6s;
    pointer-events: none;
  }
  .counter.show { opacity: 1; }

  /* Панель музыки: кнопка + громкость */
  .player {
    position: fixed; z-index: 4;
    top: max(12px, env(safe-area-inset-top)); left: 12px;
    display: flex; align-items: center; gap: 10px;
    padding: 4px 14px 4px 4px;
    border-radius: 999px;
    border: 1px solid rgba(122,240,181,.25);
    background: rgba(4,55,42,.35);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: default;
  }
  .vol {
    -webkit-appearance: none; appearance: none;
    width: clamp(80px, 22vw, 120px); height: 24px;
    background: transparent; cursor: pointer;
    --p: 25%;
  }
  .vol:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; border-radius: 4px; }
  .vol::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--mint) var(--p), rgba(201,247,221,.22) var(--p));
  }
  .vol::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(201,247,221,.22); }
  .vol::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--mint); }
  .vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
    background: var(--mint-soft); border: none;
    box-shadow: 0 0 10px rgba(60,230,150,.7);
  }
  .vol::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--mint-soft); border: none;
    box-shadow: 0 0 10px rgba(60,230,150,.7);
  }
  .vol-val {
    min-width: 3ch; font-size: 15px; color: rgba(201,247,221,.8);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .music {
    flex: none;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid rgba(122,240,181,.35);
    background: rgba(4,55,42,.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--mint-soft);
    cursor: pointer;
    transition: transform .2s, background .3s, box-shadow .3s;
  }
  .music:hover { transform: scale(1.06); background: rgba(12,106,74,.55); }
  .music:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
  .music.on { box-shadow: 0 0 18px rgba(60,230,150,.45); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .bars i { display: block; width: 3px; height: 4px; border-radius: 2px; background: currentColor; transition: height .3s; }
  .music.on .bars i { animation: eq 1s ease-in-out infinite; }
  .music.on .bars i:nth-child(2) { animation-delay: -.3s; }
  .music.on .bars i:nth-child(3) { animation-delay: -.6s; }
  .music.on .bars i:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 16px; } }

  @media (prefers-reduced-motion: reduce) {
    .aurora, .heart { animation: appear .01s forwards; }
    h1 .ch { animation: letter .01s forwards; }
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="aurora"></div>
  <div class="aurora two"></div>
  <canvas id="fx"></canvas>

  <div class="player" id="player">
    <button class="music" id="music" type="button" aria-label="Включить музыку" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <input class="vol" id="vol" type="range" min="0" max="100" step="1" value="25" aria-label="Громкость музыки">
    <span class="vol-val" id="volVal" aria-hidden="true">25%</span>
  </div>

  <main>
    <svg class="heart" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c9f7dd"/>
          <stop offset=".45" stop-color="#2ecc8f"/>
          <stop offset="1" stop-color="#0a6b48"/>
        </linearGradient>
        <radialGradient id="hl" cx=".32" cy=".3" r=".35">
          <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="url(#hg)"/>
      <path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="url(#hl)"/>
    </svg>

    <h1 id="title" aria-label="Ариша, я тебя люблю"></h1>
    <p class="sub" id="sub"></p>
  </main>

  <div class="counter" id="counter"></div>
  <div class="hint" id="hint">коснись экрана ♪ ♡</div>

<script>
(() => {
  /* ---------- Заголовок по буквам ---------- */
  const lines = ["Ариша,", "я тебя люблю"];
  const title = document.getElementById("title");
  let delay = 0.9;
  lines.forEach(text => {
    const line = document.createElement("span");
    line.className = "line";
    line.setAttribute("aria-hidden", "true");
    for (const c of text) {
      if (c === " ") {
        const sp = document.createElement("span"); sp.className = "sp"; line.appendChild(sp);
        delay += 0.08; continue;
      }
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      s.style.animationDelay = `${delay}s, ${delay}s`;
      line.appendChild(s);
      delay += 0.11;
    }
    delay += 0.35;
    title.appendChild(line);
  });

  /* ---------- Сменяющиеся подписи ---------- */
  const phrases = [
    "ты — самое прекрасное, что со мной случилось",
    "с тобой каждый день — праздник",
    "ты моё солнышко и мой дом",
    "спасибо, что ты есть",
    "люблю тебя больше всех на свете",
    "ты делаешь мою жизнь счастливой",
    "навсегда вместе ♡"
  ];
  const sub = document.getElementById("sub");
  let pi = 0;
  function nextPhrase() {
    sub.classList.remove("show");
    setTimeout(() => {
      sub.textContent = phrases[pi % phrases.length];
      pi++;
      sub.classList.add("show");
    }, 900);
  }
  setTimeout(() => { nextPhrase(); setInterval(nextPhrase, 5200); }, (delay + 0.4) * 1000);

  /* ---------- Музыка: песня music.mp3, запасной вариант — пианино на Web Audio ---------- */
  const music = (() => {
    let ac, master, wet, volume, timer, playing = false;
    let userVolume = 0.25; // 0–1, по умолчанию 25%

    // Песня: файл music.mp3 рядом со страницей, грузим заранее.
    // Если файл не загрузится, играет запасная мелодия на пианино.
    let trackData = null, trackBuf = null, decoding = null;
    let src = null, srcGain = null, srcStartedAt = 0, offset = 0, playToken = 0;
    const trackLoad = fetch("music.mp3")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(d => { trackData = d; })
      .catch(() => {});
    let step = 0, nextTime = 0;
    const BPM = 70, EIGHTH = 60 / BPM / 2;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    // Аккорды: C G Am Em F C Dm G
    const chords = [
      [48, 55, 64, 67], [43, 50, 59, 62], [45, 52, 60, 64], [40, 47, 55, 59],
      [41, 48, 57, 60], [48, 55, 64, 67], [38, 45, 53, 57], [43, 50, 59, 62]
    ];
    // Мелодия: [доля, нота, длительность в долях]
    const melody = [
      [[0, 76, 1.5], [1.5, 74, .5], [2, 72, 2]],
      [[0, 74, 1.5], [1.5, 72, .5], [2, 71, 2]],
      [[0, 72, 1], [1, 71, 1], [2, 69, 1], [3, 72, 1]],
      [[0, 71, 3], [3, 67, 1]],
      [[0, 69, 1.5], [1.5, 71, .5], [2, 72, 1], [3, 77, 1]],
      [[0, 76, 2], [2, 72, 2]],
      [[0, 74, 1], [1, 72, 1], [2, 69, 1], [3, 74, 1]],
      [[0, 71, 2], [2, 74, 1], [3, 79, 1]]
    ];
    const arp = [0, 1, 2, 3, 2, 1, 2, 1];

    function makeReverb() {
      const len = ac.sampleRate * 3.2;
      const buf = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      const conv = ac.createConvolver();
      conv.buffer = buf;
      return conv;
    }

    function init() {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      volume = ac.createGain();
      volume.gain.value = userVolume;
      volume.connect(ac.destination);
      // пианино идёт через компрессор, песня — напрямую на громкость
      const comp = ac.createDynamicsCompressor();
      const pianoLevel = ac.createGain();
      pianoLevel.gain.value = 1.4;
      comp.connect(pianoLevel); pianoLevel.connect(volume);
      master = ac.createGain();
      master.gain.value = 0;
      master.connect(comp);
      const rev = makeReverb();
      wet = ac.createGain(); wet.gain.value = 0.3;
      wet.connect(rev); rev.connect(master);
    }

    // Нота пианино: обертоны с лёгкой негармоничностью струны,
    // яркая атака, которая постепенно становится мягче, и затухание
    function piano(midi, t, dur, vol) {
      const f = mtof(midi);
      vol *= 0.88 + Math.random() * 0.2; // живая «сила нажатия»
      const out = ac.createGain();
      const lp = ac.createBiquadFilter();
      lp.type = "lowpass"; lp.Q.value = 0.4;
      lp.frequency.setValueAtTime(Math.min(f * 9, 9000), t);
      lp.frequency.setTargetAtTime(Math.max(f * 2.5, 500), t, 0.35);
      const decay = 0.6 + Math.max(0, 96 - midi) * 0.045; // низкие ноты звучат дольше
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(vol, t + 0.004);
      out.gain.setTargetAtTime(vol * 0.45, t + 0.004, 0.12);
      out.gain.setTargetAtTime(0, t + 0.15, decay);
      out.gain.setTargetAtTime(0, t + dur, 0.15); // отпускание клавиши
      lp.connect(out); out.connect(master); out.connect(wet);
      const partials = [1, 0.55, 0.3, 0.18, 0.1, 0.06, 0.035];
      const B = 0.00035;
      partials.forEach((amp, i) => {
        const n = i + 1;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "sine";
        o.frequency.value = f * n * Math.sqrt(1 + B * n * n);
        g.gain.setValueAtTime(amp * 0.42, t);
        g.gain.setTargetAtTime(0, t, 0.25 + 1.6 / n); // высокие обертоны гаснут быстрее
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + dur + 1);
      });
      // вторая струна хора, чуть расстроенная, даёт «рояльную» глубину
      const o2 = ac.createOscillator();
      const g2 = ac.createGain();
      o2.type = "triangle"; o2.frequency.value = f; o2.detune.value = 1.5;
      g2.gain.value = 0.12;
      o2.connect(g2); g2.connect(lp);
      o2.start(t); o2.stop(t + dur + 1);
    }

    function schedule(s, t) {
      const bar = Math.floor(s / 8) % 8;
      const pos = s % 8;
      const loop = Math.floor(s / 64);
      const chord = chords[bar];
      const barLeft = (8 - pos) * EIGHTH; // правая педаль: держим до конца такта
      if (pos === 0) {
        const bass = chord[0] >= 45 ? chord[0] - 12 : chord[0];
        piano(bass, t, barLeft + 0.3, 0.16);
      }
      const a = chord[arp[pos]];
      piano(a < 52 ? a + 12 : a, t, barLeft + 0.2, 0.06);
      for (const [beat, n, len] of melody[bar]) {
        if (beat * 2 === pos) {
          piano(n, t, len * EIGHTH * 2 + 0.25, 0.17);
          if (loop % 2 === 1) piano(n + 12, t, len * EIGHTH * 2, 0.05);
        }
      }
    }

    function tick() {
      while (nextTime < ac.currentTime + 0.25) {
        schedule(step, nextTime);
        step++;
        nextTime += EIGHTH;
      }
    }

    function ramp(param, to, time) {
      const now = ac.currentTime;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(to, now + time);
    }

    function decodeTrack() {
      if (!decoding) {
        decoding = trackLoad
          .then(() => {
            if (!trackData) throw new Error("no track");
            return new Promise((res, rej) => ac.decodeAudioData(trackData, res, rej));
          })
          .then(b => { trackBuf = b; })
          .catch(() => { trackBuf = null; });
      }
      return decoding;
    }

    function startTrack() {
      srcGain = ac.createGain();
      srcGain.gain.value = 0;
      srcGain.connect(volume);
      src = ac.createBufferSource();
      src.buffer = trackBuf;
      src.loop = true;
      src.connect(srcGain);
      offset %= trackBuf.duration;
      src.start(0, offset);
      srcStartedAt = ac.currentTime - offset;
      ramp(srcGain.gain, 1, 1.0);
    }

    function stopTrack() {
      if (!src) return;
      offset = (ac.currentTime - srcStartedAt) % trackBuf.duration; // продолжим с того же места
      ramp(srcGain.gain, 0, 0.6);
      src.stop(ac.currentTime + 0.65);
      src = null; srcGain = null;
    }

    function startPiano() {
      nextTime = ac.currentTime + 0.1;
      ramp(master.gain, 0.9, 1.5);
      clearInterval(timer);
      timer = setInterval(tick, 40);
      tick();
    }

    return {
      get playing() { return playing; },
      start() {
        if (!ac) init();
        ac.resume();
        playing = true;
        const token = ++playToken;
        decodeTrack().then(() => {
          if (!playing || token !== playToken) return;
          trackBuf ? startTrack() : startPiano();
        });
      },
      stop() {
        if (!ac) return;
        playing = false;
        playToken++;
        clearInterval(timer);
        ramp(master.gain, 0, 0.6);
        stopTrack();
      },
      setVolume(v) {
        userVolume = v;
        if (volume) volume.gain.setTargetAtTime(v, ac.currentTime, 0.05);
      },
      suspend() { if (ac) ac.suspend(); },
      resume() { if (ac && playing) ac.resume(); }
    };
  })();

  const musicBtn = document.getElementById("music");
  function setMusic(on) {
    on ? music.start() : music.stop();
    musicBtn.classList.toggle("on", on);
    musicBtn.setAttribute("aria-pressed", String(on));
    musicBtn.setAttribute("aria-label", on ? "Выключить музыку" : "Включить музыку");
  }
  let userTouchedMusic = false;
  // Громкость: по умолчанию 25%, выбор сохраняется в браузере
  const VOL_KEY = "arisha-volume";
  const vol = document.getElementById("vol");
  const volVal = document.getElementById("volVal");
  function applyVolume(v, save) {
    vol.value = v;
    vol.style.setProperty("--p", v + "%");
    volVal.textContent = v + "%";
    music.setVolume(v / 100);
    if (save) { try { localStorage.setItem(VOL_KEY, String(v)); } catch (e) {} }
  }
  let savedVol = 25;
  try {
    const raw = localStorage.getItem(VOL_KEY);
    if (raw !== null && !isNaN(parseInt(raw, 10))) savedVol = Math.max(0, Math.min(100, parseInt(raw, 10)));
  } catch (e) {}
  applyVolume(savedVol, false);
  vol.addEventListener("input", () => applyVolume(parseInt(vol.value, 10), true));

  // касания панели музыки не считаются кликами-сердечками
  document.getElementById("player").addEventListener("pointerdown", e => e.stopPropagation());
  musicBtn.addEventListener("click", e => {
    e.stopPropagation();
    userTouchedMusic = true;
    setMusic(!music.playing);
  });
  document.addEventListener("visibilitychange", () => {
    document.hidden ? music.suspend() : music.resume();
  });

  /* ---------- Звёздное небо ---------- */
  const sky = document.getElementById("sky");
  const sctx = sky.getContext("2d");
  const fx = document.getElementById("fx");
  const ctx = fx.getContext("2d");
  let W, H, DPR, stars = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [sky, fx]) {
      c.width = W * DPR; c.height = H * DPR;
    }
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(W * H / 3500);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 0.02 + 0.005
    }));
  }
  addEventListener("resize", resize);
  resize();

  /* ---------- Сердечки ---------- */
  function heartPath(c, x, y, size) {
    const s = size / 2;
    c.beginPath();
    c.moveTo(x, y + s * 0.7);
    c.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.45);
    c.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.2, y - s * 0.1, x, y + s * 0.7);
    c.closePath();
  }

  const palette = ["#2ecc8f", "#3ddc97", "#7af0b5", "#c9f7dd", "#9be15d", "#1fa57a", "#f3e3a6", "#5fe0c8"];
  const floaters = [];
  const bursts = [];
  const shooting = [];

  function spawnFloater(initial) {
    const size = Math.random() * 16 + 8;
    floaters.push({
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + 30,
      size,
      vy: -(Math.random() * 0.45 + 0.25) * (size / 14),
      sway: Math.random() * 1.5 + 0.5,
      phase: Math.random() * Math.PI * 2,
      rot: (Math.random() - 0.5) * 0.5,
      alpha: Math.random() * 0.35 + 0.25,
      color: palette[(Math.random() * palette.length) | 0]
    });
  }
  const floaterCount = () => Math.round(Math.min(45, W / 28));
  for (let i = 0; i < floaterCount(); i++) spawnFloater(true);

  function burst(x, y, n = 26) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 6 + 2;
      bursts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 2,
        size: Math.random() * 14 + 6,
        life: 1,
        decay: Math.random() * 0.012 + 0.01,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2,
        color: palette[(Math.random() * palette.length) | 0]
      });
    }
  }

  /* ---------- Клики / тапы ---------- */
  const counter = document.getElementById("counter");
  // Клики сохраняются в браузере и не пропадают после перезагрузки страницы или компьютера
  const TAPS_KEY = "arisha-taps";
  let taps = 0;
  try { taps = parseInt(localStorage.getItem(TAPS_KEY), 10) || 0; } catch (e) {}
  function showCounter() {
    counter.textContent = `${tapWords[Math.min(tapWords.length - 1, Math.floor(taps / 10))]} × ${taps}`;
    counter.classList.add("show");
  }
  const tapWords = ["люблю", "очень люблю", "безумно люблю", "бесконечно люблю"];
  addEventListener("pointerdown", e => {
    burst(e.clientX, e.clientY);
    taps++;
    try { localStorage.setItem(TAPS_KEY, String(taps)); } catch (e) {}
    showCounter();
    // первое касание включает музыку (браузеры не дают играть звук без касания)
    if (!userTouchedMusic && !music.playing) { userTouchedMusic = true; setMusic(true); }
  });

  if (taps > 0) showCounter();

  // Салют из сердечек после появления текста
  setTimeout(() => burst(W / 2, H / 2, 60), (delay + 0.2) * 1000);

  /* ---------- Анимация ---------- */
  let t = 0;
  function frame() {
    t++;
    sctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = 0.35 + Math.sin(t * s.s + s.p) * 0.35 + 0.3;
      sctx.globalAlpha = Math.max(0, Math.min(1, a));
      sctx.fillStyle = "#eafff3";
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
    }
    if (Math.random() < 0.004) {
      shooting.push({ x: Math.random() * W * 0.8, y: Math.random() * H * 0.4, vx: 7 + Math.random() * 4, vy: 3 + Math.random() * 2, life: 1 });
    }
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.018;
      const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
      g.addColorStop(0, `rgba(220,255,235,${Math.max(0, s.life)})`);
      g.addColorStop(1, "rgba(220,255,235,0)");
      sctx.globalAlpha = 1;
      sctx.strokeStyle = g; sctx.lineWidth = 1.6;
      sctx.beginPath(); sctx.moveTo(s.x, s.y); sctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); sctx.stroke();
      if (s.life <= 0) shooting.splice(i, 1);
    }
    sctx.globalAlpha = 1;

    ctx.clearRect(0, 0, W, H);
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y += f.vy;
      const x = f.x + Math.sin(t * 0.01 * f.sway + f.phase) * 18;
      ctx.save();
      ctx.translate(x, f.y);
      ctx.rotate(f.rot + Math.sin(t * 0.008 + f.phase) * 0.15);
      ctx.globalAlpha = f.alpha;
      ctx.shadowColor = f.color; ctx.shadowBlur = 12;
      ctx.fillStyle = f.color;
      heartPath(ctx, 0, 0, f.size);
      ctx.fill();
      ctx.restore();
      if (f.y < -40) floaters.splice(i, 1);
    }
    while (floaters.length < floaterCount()) spawnFloater(false);

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy;
      b.vx *= 0.97; b.vy = b.vy * 0.97 + 0.08;
      b.rot += b.vr;
      b.life -= b.decay;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.globalAlpha = Math.max(0, b.life);
      ctx.shadowColor = b.color; ctx.shadowBlur = 16;
      ctx.fillStyle = b.color;
      heartPath(ctx, 0, 0, b.size * (0.6 + b.life * 0.4));
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
